<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16a34a">
<title>อร่อยจัง · ตังเกือบครบ</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  :root{
    --green-700:#15803d; --green-600:#16a34a; --green-500:#22c55e;
    --green-100:#dcfce7; --green-50:#f0fdf4;
    --ink:#1a2e22; --muted:#5b6b60; --line:#e6ece7;
    --bg:#f6f8f6; --surface:#ffffff;
    --amber:#f59e0b; --danger:#dc2626;
    --radius:16px; --shell:460px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --nav-h:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    font-size:16px; -webkit-font-smoothing:antialiased;
    overflow-x:clip;
  }
  img{max-width:100%;display:block}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid var(--green-600);outline-offset:2px;border-radius:8px}

  /* ---------- Shell ---------- */
  .shell{
    max-width:var(--shell); margin-inline:auto; min-height:100dvh;
    background:var(--bg); position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.06);
    padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  }

  /* ---------- Brand title bar ---------- */
  .brandbar{
    background:var(--green-600); color:#fff; text-align:center;
    padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;
    font-size:15px; font-weight:800; letter-spacing:1px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:10px 12px;
    display:flex; align-items:center; gap:8px;
  }
  .icon-btn{
    width:44px;height:44px;border-radius:12px;
    display:grid;place-items:center;color:var(--green-700);
    background:var(--green-50);flex:0 0 auto;
    transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:active{transform:scale(.92);background:var(--green-100)}
  .icon-btn svg{width:22px;height:22px}
  .brand{
    width:72px;height:72px;flex:0 0 auto;border-radius:16px;
    display:grid;place-items:center;background:var(--green-50);
    transition:transform .15s ease;
  }
  .brand:active{transform:scale(.92)}
  .brand img{width:64px;height:64px;object-fit:contain}
  .search{
    flex:1 1 0; min-width:0; display:flex; align-items:center; gap:8px;
    background:var(--bg); border:1px solid var(--line);
    border-radius:12px; padding:0 12px; height:44px;
  }
  .search svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
  .search input{
    border:none;background:none;flex:1;font-size:15px;color:var(--ink);
    min-width:0;
  }
  .search input:focus{outline:none}

  /* ---------- Banner carousel ---------- */
  .banner{padding:12px 12px 0}
  .banner-track{
    display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
    border-radius:var(--radius);
  }
  .banner-track::-webkit-scrollbar{display:none}
  .banner-slide{
    flex:0 0 100%; scroll-snap-align:center;
    border-radius:var(--radius); overflow:hidden; aspect-ratio:27/10;
    background:#e9efe9;
  }
  .banner-slide img{width:100%;height:100%;object-fit:cover}
  .dots{display:flex;justify-content:center;gap:6px;padding:10px 0 2px}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .2s,background .2s}
  .dot.is-active{width:20px;background:var(--green-600)}

  /* ---------- Section head + mascot ---------- */
  .section-head{
    position:relative; padding:18px 16px 6px;
  }
  .section-head > div{padding-right:120px}
  .section-head h1{
    font-size:20px; font-weight:800; color:var(--green-700);
    letter-spacing:.2px;
  }
  .section-head p{font-size:13px;color:var(--muted);margin-top:2px}
  .mascot{
    position:absolute; right:6px; top:-56px;
    width:156px;height:156px; pointer-events:none;
    filter:drop-shadow(0 6px 10px rgba(21,128,61,.22));
    animation:bob 3.5s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  /* ---------- Filter chips ---------- */
  .chips{
    display:flex; flex-wrap:nowrap; gap:8px; overflow-x:auto; padding:8px 16px 4px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:9px 16px; border-radius:99px;
    background:var(--surface); border:1px solid var(--line);
    font-size:14px; font-weight:600; color:var(--muted);
    min-height:40px; transition:transform .12s ease;
  }
  .chip:active{transform:scale(.94)}
  .chip.is-active{background:var(--green-600);color:#fff;border-color:var(--green-600)}

  /* ---------- Product grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(2,1fr);
    gap:12px; padding:12px 16px 8px;
  }
  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:active{transform:scale(.98)}
  .card-media{position:relative;aspect-ratio:1/1;background:var(--green-50)}
  .card-media svg{width:100%;height:100%}
  .badge{
    position:absolute; top:8px; left:8px;
    background:var(--danger); color:#fff; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:99px;
  }
  .badge.new{background:var(--green-600)}
  .fav{
    position:absolute; top:6px; right:6px; width:32px;height:32px;
    border-radius:99px; background:rgba(255,255,255,.9);
    display:grid;place-items:center;color:var(--muted);
  }
  .fav svg{width:16px;height:16px}
  .fav.is-on{color:var(--danger)}
  .card-body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card-title{font-size:14px;font-weight:600;line-height:1.35}
  .rating{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
  .rating svg{width:13px;height:13px;color:var(--amber)}
  .price-row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .price{font-size:16px;font-weight:800;color:var(--green-700)}
  .price small{font-size:11px;font-weight:500;color:var(--muted)}
  .add{
    width:38px;height:38px;border-radius:12px;background:var(--green-600);
    color:#fff;display:grid;place-items:center;flex:0 0 auto;
    transition:transform .12s ease, background .12s ease;
  }
  .add svg{width:18px;height:18px}
  .add:active{transform:scale(.88);background:var(--green-700)}

  /* ---------- Sticker filler tile ---------- */
  .sticker-tile{
    display:grid; place-items:center; padding:10px;
    min-height:100%;
  }
  .sticker-tile img{
    width:100%; max-width:150px;
    filter:drop-shadow(0 6px 12px rgba(21,128,61,.25));
    transform-origin:50% 90%;
    animation:wiggle 1.1s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(-7deg) translateY(0) scale(1)}
    15%{transform:rotate(7deg) translateY(-4px) scale(1.04)}
    30%{transform:rotate(-6deg) translateY(0) scale(1)}
    45%{transform:rotate(6deg) translateY(-3px) scale(1.03)}
    60%{transform:rotate(-4deg) translateY(0) scale(1)}
    75%{transform:rotate(3deg) translateY(-2px) scale(1.02)}
  }

  /* ---------- Ad card ---------- */
  .ad-card{
    grid-column:span 2; background:var(--surface);
    border:1px dashed #c9d3cb; border-radius:var(--radius);
    padding:16px; display:flex; align-items:center; gap:14px;
  }
  .ad-logo{width:44px;height:44px;flex:0 0 auto}
  .ad-card .lbl{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px}
  .ad-card .txt{font-size:14px;font-weight:600;color:var(--ink)}
  .ad-card .sub{font-size:12px;color:var(--muted)}

  /* ---------- Footer ---------- */
  .foot{
    margin-top:14px; background:var(--green-600); color:#fff;
    padding:22px 16px; text-align:center;
  }
  .foot img{width:64px;margin:0 auto 8px;filter:brightness(0) invert(1)}
  .foot p{font-size:12px;opacity:.9}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0;
    width:100%; max-width:var(--shell); z-index:50;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; justify-content:space-around;
    padding:6px 4px calc(6px + var(--safe-b));
    height:calc(var(--nav-h) + var(--safe-b));
  }
  .navitem{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 0; color:var(--muted); font-size:11px; font-weight:600;
    min-height:44px; position:relative;
  }
  .navitem--wrap{border-radius:12px;transition:background .15s}
  .navitem:active{background:var(--green-50)}
  .navitem svg{width:22px;height:22px}
  .navitem.is-active{color:var(--green-600)}
  .cart-count{
    position:absolute; top:2px; left:calc(50% + 6px);
    background:var(--danger); color:#fff; font-size:10px; font-weight:700;
    min-width:16px; height:16px; border-radius:99px; display:grid; place-items:center;
    padding:0 3px; transform:scale(0); transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .cart-count.show{transform:scale(1)}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
    transform:translate(-50%,20px); opacity:0; pointer-events:none;
    background:var(--ink); color:#fff; font-size:13px; font-weight:600;
    padding:10px 16px; border-radius:99px; z-index:60;
    transition:transform .25s ease, opacity .25s ease;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{transform:translate(-50%,0);opacity:1}
  .toast svg{width:16px;height:16px;color:var(--green-500)}

  /* ---------- Map view (full screen) ---------- */
  .mapview{
    position:fixed;inset:0;z-index:80;background:var(--surface);
    display:flex;flex-direction:column;
  }
  .mapview[hidden]{display:none}
  .mapview__bar{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:calc(12px + env(safe-area-inset-top,0px)) 14px 14px;
  }
  .mapview__bar b{font-size:18px;color:var(--ink);flex:1;letter-spacing:.2px}
  .mapview__bar .count{
    font-size:12px;color:var(--green-700);font-weight:800;
    background:var(--green-50);padding:5px 11px;border-radius:99px;
  }
  .map-search{position:absolute;top:12px;left:12px;right:12px;z-index:1200}
  .map-search input{
    width:100%;height:48px;border:none;border-radius:24px;
    padding:0 18px 0 46px;font-size:14px;background:var(--surface);color:var(--ink);
    box-shadow:0 6px 20px rgba(16,40,25,.18);
  }
  .map-search input:focus{outline:none;box-shadow:0 6px 20px rgba(22,163,74,.28)}
  .map-search__ico{
    position:absolute;left:28px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--muted);pointer-events:none;
  }
  .map-search__results{
    margin-top:8px;
    background:var(--surface);border:none;border-radius:16px;
    box-shadow:0 14px 34px rgba(16,40,25,.2);max-height:250px;overflow-y:auto;
  }
  .map-search__results:empty{display:none}
  .map-search__results button{
    display:block;width:100%;text-align:left;padding:12px 16px;
    font-size:13px;line-height:1.45;color:var(--ink);border-bottom:1px solid var(--line);
  }
  .map-search__results button:last-child{border-bottom:none}
  .map-search__results button:active{background:var(--green-50)}
  .mapview__map{
    position:relative;flex:1 1 auto;min-height:0;background:#e3ebe1;overflow:hidden;
  }
  #lmap{position:absolute;inset:0;background:#e3ebe1}
  .leaflet-container{font:inherit;background:#e3ebe1}
  #lmap .leaflet-control-zoom{
    border:none;border-radius:16px;overflow:hidden;
    box-shadow:0 6px 18px rgba(16,40,25,.2);margin:0 12px 84px 0;
  }
  #lmap .leaflet-control-zoom a{
    width:44px;height:44px;line-height:44px;font-size:20px;font-weight:700;
    color:var(--green-700);background:var(--surface);border:none;
  }
  #lmap .leaflet-control-zoom a:hover{background:var(--green-50)}
  #lmap .leaflet-control-zoom a:first-child{border-bottom:1px solid var(--line)}
  #lmap .leaflet-control-attribution{
    background:rgba(255,255,255,.78);font-size:10px;color:var(--muted);
    padding:2px 7px;border-radius:8px 0 0 0;
  }
  #lmap .leaflet-control-attribution a{color:var(--green-700)}
  #lmap .leaflet-popup-content-wrapper{border-radius:16px;box-shadow:0 10px 30px rgba(16,40,25,.24)}
  #lmap .leaflet-popup-content{font-size:13px;line-height:1.55;margin:13px 15px}
  #lmap .leaflet-popup-content b{color:var(--green-700)}
  #lmap .leaflet-popup-content a{color:var(--green-600);font-weight:700}
  .lpin{position:relative;width:36px;height:46px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
  .lpin svg{width:36px;height:46px;display:block}
  .lpin--brand{width:34px;height:44px}
  .lpin--brand svg{width:34px;height:44px}
  .lpin--mini{width:30px;height:40px}
  .lpin--mini svg{width:30px;height:40px}
  .lme{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
  #lmap .marker-cluster{background:rgba(21,128,61,.28)}
  #lmap .marker-cluster div{background:var(--green-600);color:#fff;font-weight:800}
  #lmap .marker-cluster span{line-height:30px}
  .lsearch{width:20px;height:20px;border-radius:50%;background:#dc2626;border:3px solid #fff;box-shadow:0 0 0 5px rgba(220,38,38,.22)}
  .map-locate{
    position:absolute;right:12px;bottom:20px;z-index:1000;
    width:52px;height:52px;border-radius:50%;background:var(--green-600);
    box-shadow:0 8px 22px rgba(22,163,74,.4);display:grid;place-items:center;color:#fff;
  }
  .map-locate svg{width:24px;height:24px}
  .map-locate.loading svg{animation:spin 1s linear infinite}
  .map-locate:active{background:var(--green-700)}
  .mapview__loading{
    position:absolute;inset:0;z-index:2000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:var(--surface);text-align:center;padding:24px;
    transition:opacity .35s ease, visibility .35s ease;
  }
  .mapview__loading img{
    width:148px;height:148px;
    animation:spin 1.1s cubic-bezier(.5,.15,.5,.85) infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .mapview__loading b{font-size:16px;color:var(--green-700)}
  .mapview__loading span{font-size:13px;color:var(--muted)}
  .mapview.ready .mapview__loading{opacity:0;visibility:hidden}
  .mapview__list{
    flex:0 0 auto;max-height:36dvh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;background:var(--surface);
    border-radius:20px 20px 0 0;margin-top:-16px;position:relative;z-index:5;
    box-shadow:0 -8px 24px rgba(16,40,25,.1);
    padding:0 12px calc(12px + var(--safe-b));
  }
  .mapview__list::before{
    content:"";display:block;width:44px;height:4px;border-radius:99px;
    background:var(--line);margin:8px auto 2px;
  }
  .branch{
    display:flex;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line);
  }
  .branch:last-child{border-bottom:none}
  .branch.is-active{background:var(--green-50);border-radius:14px;box-shadow:inset 0 0 0 2px var(--green-500)}
  .branch__badge{
    display:inline-block;background:var(--green-600);color:#fff;
    font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;
    margin-left:6px;vertical-align:middle;
  }
  .branch img{width:74px;height:74px;border-radius:12px;object-fit:cover;flex:0 0 auto}
  .branch__art{width:74px;height:74px;border-radius:12px;overflow:hidden;flex:0 0 auto}
  .branch__art svg{width:100%;height:100%;display:block}
  .branch__art.is-closed{filter:grayscale(1);opacity:.65}
  .branch__info{flex:1;min-width:0}
  .branch__info h3{font-size:14px;font-weight:700}
  .branch__info .addr{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
  .branch__meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:12px;font-weight:700}
  .branch__meta .rate{color:#f59e0b}
  .branch__meta .dist{color:var(--green-700)}
  .branch__meta .open{color:var(--green-600)}
  .branch__meta .closed{color:#dc2626}
  .branch__nav{
    align-self:center;flex:0 0 auto;width:44px;height:44px;border-radius:12px;
    background:var(--green-600);color:#fff;display:grid;place-items:center;
  }
  .branch__nav svg{width:20px;height:20px}
  .branch__nav:active{background:var(--green-700)}

  /* ---------- Shop detail sheet ---------- */
  .shopsheet{position:fixed;inset:0;z-index:2500}
  .shopsheet[hidden]{display:none}
  .shopsheet__scrim{position:absolute;inset:0;background:rgba(10,22,15,.55)}
  .shopsheet__panel{
    position:absolute;left:50%;bottom:0;
    transform:translate(-50%,100%);
    transition:transform .3s cubic-bezier(.22,1,.36,1);
    width:100%;max-width:min(var(--shell), 520px);background:var(--surface);
    border-radius:22px 22px 0 0;overflow:hidden;max-height:90dvh;
    display:flex;flex-direction:column;
  }
  .shopsheet:not([hidden]) .shopsheet__panel{transform:translate(-50%,0)}
  .shopsheet__hero{position:relative;flex:0 0 auto;height:150px;overflow:hidden;background:var(--green-50)}
  .shopsheet__hero > div{position:absolute;inset:0}
  .shopsheet__hero svg{width:100%;height:100%;display:block}
  .shopsheet__hero.is-closed{filter:grayscale(1)}
  .shopsheet__close{
    position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--ink);
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .shopsheet__close svg{width:18px;height:18px}
  .shopsheet__body{padding:14px 16px calc(18px + var(--safe-b));overflow-y:auto}
  .shopsheet__title{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
  .shopsheet__title h3{font-size:19px;font-weight:800;line-height:1.3}
  .ss-status{flex:0 0 auto;font-size:11px;font-weight:800;padding:5px 10px;border-radius:99px;white-space:nowrap}
  .ss-status.open{background:var(--green-50);color:var(--green-700)}
  .ss-status.closed{background:#fee2e2;color:#dc2626}
  .ss-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;font-weight:700}
  .ss-meta .rate{color:#f59e0b}
  .ss-meta .dist{color:var(--green-700)}
  .ss-meta .price,.ss-meta .cuisine{color:var(--muted)}
  .ss-rows{margin-top:14px;border-top:1px solid var(--line)}
  .ss-row{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}
  .ss-row svg{width:18px;height:18px;color:var(--green-600);flex:0 0 auto;margin-top:3px}
  .ss-row .k{font-size:11px;color:var(--muted);font-weight:700}
  .ss-row .v{font-size:14px;line-height:1.45}
  .ss-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .ss-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    height:66px;border-radius:16px;background:var(--green-50);color:var(--green-700);
    font-size:12px;font-weight:800;transition:transform .12s ease;
  }
  .ss-btn svg{width:20px;height:20px}
  .ss-btn--primary{background:var(--green-600);color:#fff}
  .ss-btn:active{transform:scale(.95)}

  /* ---------- Responsive: tablet & desktop ---------- */
  @media (min-width:700px){
    :root{--shell:768px}
    .grid{grid-template-columns:repeat(3,1fr)}
    .section-head h1{font-size:24px}

  }
  @media (min-width:1040px){

    .banner,.section-head,.chips,.grid{max-width:1360px;margin-inline:auto}

    .section-head > div{padding-right:210px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition-duration:.01ms!important}
  }
</style>

<script>
(function(){

      '<path d="M30 30c6-6 12-6 18 0" stroke="'+c[1]+'" stroke-width="3" fill="none" stroke-linecap="round"/>'+
      '</svg>';
  }

  var ITEMS = [
    {n:"ข้าวกะเพราหมูสับไข่ดาว", c:"rice",   p:60, r:4.9, s:1200, tag:"ขายดี"},

    {n:"ตำไทยไข่เค็ม",           c:"salad",  p:55, r:4.9, s:1320, tag:"ขายดี"},

  ];

  var grid = document.getElementById("grid");

    var badge = it.tag === "ใหม่" ? '<span class="badge new">ใหม่</span>'
              : it.tag === "ขายดี" ? '<span class="badge">ขายดี</span>' : "";
    html +=
      '<article class="card">'+
        '<div class="card-media">'+ dish(it.c) + badge +
          '<button class="fav" aria-label="เพิ่ม '+it.n+' ในรายการโปรด" data-fav>'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6C19 16.5 12 21 12 21z"/></svg>'+
          '</button>'+
        '</div>'+
        '<div class="card-body">'+
          '<div class="card-title">'+it.n+'</div>'+
          '<div class="rating">'+
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.9 21l1.2-6.8-5-4.9 6.9-1z"/></svg>'+
            it.r.toFixed(1)+' · ขายแล้ว '+it.s.toLocaleString("th-TH")+
          '</div>'+
          '<div class="price-row">'+
            '<div class="price">฿'+it.p+' <small>/ จาน</small></div>'+
            '<button class="add" aria-label="เพิ่ม '+it.n+' ลงตะกร้า" data-add data-name="'+it.n+'">'+

      html +=
        '<div class="sticker-tile" aria-hidden="true">'+

          '<img class="ad-logo" src="assets/logo.png" alt="">'+

          '</div>'+
        '</div>';
    }
  });
  grid.innerHTML = html;

  /* ---- Cart ---- */

  var cc = document.getElementById("cartCount");
  var toast = document.getElementById("toast");
  var toastMsg = document.getElementById("toastMsg");
  var tHide;

  function showToast(msg){
    toastMsg.textContent = msg;
    toast.classList.add("show");
    clearTimeout(tHide);
    tHide = setTimeout(function(){ toast.classList.remove("show"); }, 2200);
  }

  grid.addEventListener("click", function(e){
    var add = e.target.closest("[data-add]");
    if(add){
      count++;
      cc.textContent = count;
      cc.classList.add("show");
      cc.style.animation = "none"; cc.offsetWidth; cc.style.animation = "";
      showToast("เพิ่ม “"+add.dataset.name+"” ลงตะกร้าแล้ว");
      if(navigator.vibrate) navigator.vibrate(12);
      return;
    }
    var fav = e.target.closest("[data-fav]");
    if(fav){ fav.classList.toggle("is-on"); }
  });

  /* ---- Filter chips ---- */
  var chips = document.getElementById("chips");
  chips.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(!chip) return;
    chips.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("is-active"); });
    chip.classList.add("is-active");
  });

  /* ---- Banner carousel ---- */
  var track = document.getElementById("bannerTrack");
  var slides = track.children.length;
  var dotsWrap = document.getElementById("dots");
  for(var d=0; d<slides; d++){
    var dot = document.createElement("span");
    dot.className = "dot" + (d===0 ? " is-active" : "");
    dotsWrap.appendChild(dot);
  }
  var dots = dotsWrap.children;
  var idx = 0, timer;

  function goTo(i){
    idx = (i + slides) % slides;
    track.scrollTo({ left: track.clientWidth * idx, behavior: "smooth" });
  }
  function sync(){
    var i = Math.round(track.scrollLeft / track.clientWidth);
    if(i === idx) return;
    idx = i;
    for(var k=0;k<dots.length;k++) dots[k].classList.toggle("is-active", k===idx);
  }
  track.addEventListener("scroll", function(){
    window.requestAnimationFrame(sync);
  }, {passive:true});

  var reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function auto(){
    if(reduce) return;
    timer = setInterval(function(){ goTo(idx+1); }, 4000);
  }
  function stop(){ clearInterval(timer); }
  track.addEventListener("touchstart", stop, {passive:true});
  track.addEventListener("touchend", function(){ stop(); auto(); }, {passive:true});
  auto();

  /* ---- Bottom nav active state ---- */
  document.querySelectorAll(".bottomnav .navitem").forEach(function(b){

      document.querySelectorAll(".bottomnav .navitem").forEach(function(x){

      b.classList.add("is-active"); b.setAttribute("aria-current","page");
    });
  });

  /* ---- Map view: ร้านอาหารใกล้ฉัน (Leaflet + OpenStreetMap) ---- */
  var CITIES = [

    {n:"ชลบุรี",   lat:13.3611, lng:100.9847, prov:"ชลบุรี"},
    {n:"พัทยา",    lat:12.9236, lng:100.8825, prov:"ชลบุรี"},
    {n:"ระยอง",    lat:12.6833, lng:101.2372, prov:"ระยอง"},
    {n:"อยุธยา",   lat:14.3692, lng:100.5877, prov:"พระนครศรีอยุธยา"},
    {n:"โคราช",    lat:14.9799, lng:102.0978, prov:"นครราชสีมา"},
    {n:"ขอนแก่น",  lat:16.4419, lng:102.8360, prov:"ขอนแก่น"},
    {n:"อุดรธานี", lat:17.4139, lng:102.7870, prov:"อุดรธานี"},
    {n:"อุบลฯ",    lat:15.2448, lng:104.8473, prov:"อุบลราชธานี"},
    {n:"เชียงใหม่",lat:18.7883, lng:98.9853,  prov:"เชียงใหม่"},
    {n:"เชียงราย", lat:19.9105, lng:99.8406,  prov:"เชียงราย"},
    {n:"พิษณุโลก", lat:16.8211, lng:100.2659, prov:"พิษณุโลก"},
    {n:"นครสวรรค์",lat:15.7047, lng:100.1372, prov:"นครสวรรค์"},
    {n:"หัวหิน",   lat:12.5684, lng:99.9577,  prov:"ประจวบคีรีขันธ์"},
    {n:"ภูเก็ต",   lat:7.8804,  lng:98.3923,  prov:"ภูเก็ต"},
    {n:"กระบี่",   lat:8.0863,  lng:98.9063,  prov:"กระบี่"},
    {n:"สุราษฎร์ฯ",lat:9.1382,  lng:99.3217,  prov:"สุราษฎร์ธานี"},
    {n:"หาดใหญ่",  lat:7.0084,  lng:100.4767, prov:"สงขลา"}
  ];
  var ROADS   = ["ถ.สุขุมวิท","ถ.เพชรเกษม","ถ.พหลโยธิน","ถ.รัชดาภิเษก","ถ.ลาดพร้าว","ถ.นิมมานเหมินท์","ถ.มิตรภาพ","ถ.รอบเมือง","ถ.ประชาราษฎร์","ซ.อารีย์"];
  var CLOSES  = ["20:00","20:30","21:00","21:30","22:00","23:00"];
  var IMGS    = ["assets/banner-1.png","assets/banner-2.png","assets/banner-3.png"];
  var DISHES  = ["ก๋วยเตี๋ยว","ข้าวมันไก่","ส้มตำ","อาหารตามสั่ง","ข้าวหมูแดง","ก๋วยจั๊บ","หมูกระทะ","ชาบู","ข้าวต้ม","ผัดไทย","โจ๊ก","ข้าวขาหมู","ต้มเลือดหมู","เย็นตาโฟ","ไก่ทอด","สเต๊ก"];
  var OWNERS  = ["ป้าแดง","เจ๊หมวย","ลุงหนวด","แม่ศรี","พี่ต้อม","เฮียเล้ง","น้านิด","ยายมล","เจ๊โอ๋","ป้าตุ๊ก","ครัวคุณต๋อย","บ้านสวน"];
  var PREFIX  = ["ครัว","ร้าน","โภชนา","เรือนไทย","ครัวคุณ","ก๋วยเตี๋ยวเรือ"];

  function rnd(a, b){ return a + Math.random() * (b - a); }
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
  function distKm(a, b){
    var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
    var s = Math.sin(dLat/2)*Math.sin(dLat/2) +
            Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
  }
  function offset(loc, km, bearing){
    var dLat = (km / 111) * Math.cos(bearing);
    var dLng = (km / (111 * Math.cos(loc.lat * Math.PI / 180))) * Math.sin(bearing);
    return {lat: loc.lat + dLat, lng: loc.lng + dLng};
  }

  var OPENS = ["08:00","09:00","10:00","11:00","16:00","17:00"];
  var CUISINES = ["อาหารตามสั่ง","ก๋วยเตี๋ยว/เส้น","อาหารอีสาน","ข้าวราดแกง","ปิ้งย่าง/หมูกระทะ","ของหวาน/เครื่องดื่ม","อาหารเช้า","อาหารทะเล"];
  var PREFIXES = ["081","082","086","089","091","095","062","064"];
  var ART = {
    "อาหารตามสั่ง":["#fff7e0","#fcd34d","#f59e0b"],
    "ก๋วยเตี๋ยว/เส้น":["#ffefef","#fca5a5","#ef4444"],
    "อาหารอีสาน":["#f2fbe3","#bef264","#84cc16"],
    "ข้าวราดแกง":["#fff1e3","#fdba74","#f97316"],
    "ปิ้งย่าง/หมูกระทะ":["#fdeef5","#f9a8d4","#ec4899"],
    "ของหวาน/เครื่องดื่ม":["#f7efff","#d8b4fe","#a855f7"],
    "อาหารเช้า":["#eaf6ff","#93c5fd","#3b82f6"],
    "อาหารทะเล":["#e6fbfd","#67e8f9","#06b6d4"]
  };
  function shopArt(sp){
    var c = ART[sp.cuisine] || ["#e9f7ee","#86efac","#22c55e"];
    var id = "g" + Math.floor(Math.random() * 1e6);
    return '<svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'+
      '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/>'+
      '</linearGradient></defs>'+
      '<rect width="200" height="120" fill="url(#'+id+')"/>'+
      '<circle cx="34" cy="24" r="26" fill="#fff" opacity=".25"/>'+
      '<circle cx="176" cy="104" r="34" fill="#fff" opacity=".18"/>'+
      '<g stroke="'+c[2]+'" stroke-width="3" stroke-linecap="round" fill="none" opacity=".75">'+
        '<path d="M86 34c-5 6 5 10 0 16"/><path d="M100 30c-5 7 5 11 0 18"/><path d="M114 34c-5 6 5 10 0 16"/>'+
      '</g>'+
      '<path d="M60 68h80a40 40 0 0 1-80 0Z" fill="#fff"/>'+
      '<path d="M60 68h80a40 40 0 0 1-80 0Z" fill="none" stroke="'+c[2]+'" stroke-width="3.5"/>'+
      '<path d="M68 76h64a32 32 0 0 1-64 0Z" fill="'+c[2]+'" opacity=".55"/>'+
      '<rect x="52" y="64" width="96" height="6" rx="3" fill="'+c[2]+'"/>'+
      '</svg>';
  }
  function makePhone(){
    var p = pick(PREFIXES), rest = String(Math.floor(rnd(1000000, 9999999)));
    return p + "-" + rest.slice(0,3) + "-" + rest.slice(3);
  }
  function makeShop(lat, lng, brand, k){
    var closed = Math.random() < 0.32;
    var openAt = pick(OPENS);
    var name = brand
      ? "สาขา" + pick(["ตลาดสด","หน้าปั๊ม","ริมคลอง","ชุมชน","ตรงข้ามโรงเรียน","หัวมุม","ในซอย","ตลาดนัด"])
      : (Math.random() < 0.5 ? pick(PREFIX) + pick(OWNERS) : pick(DISHES) + " " + pick(OWNERS));
    return {
      brand: !!brand, name: name,
      a: (5 + Math.floor(Math.random()*300)) + " " + pick(ROADS),
      lat: lat, lng: lng,
      rating: rnd(3.8, 5.0),
      sold: Math.floor(rnd(40, 3200)),
      price: "฿".repeat(1 + Math.floor(Math.random()*3)),
      closed: closed, openAt: openAt, closeAt: pick(CLOSES),
      phone: makePhone(), cuisine: pick(CUISINES),
      s: closed ? "ปิดแล้ว · เปิด " + openAt + " น." : "เปิดอยู่ · ปิด " + pick(CLOSES) + " น.",
      img: IMGS[k % IMGS.length]
    };
  }

  /* สร้างร้าน: หนาแน่นมากรอบตัวเรา + กระจายทั่วประเทศ */
  function buildShops(here){
    var shops = [], k = 0, i, j;
    for(i = 0; i < 480; i++){                       // รอบ ๆ ตำแหน่งเรา (แน่นตรงกลาง รัศมี ~9 กม.)
      var km = Math.pow(Math.random(), 0.7) * 9;
      var p = offset(here, km, Math.random() * Math.PI * 2);
      shops.push(makeShop(p.lat, p.lng, Math.random() < 0.15, k++));
    }
    for(i = 0; i < 120; i++){                       // วงกว้างขึ้นอีกหน่อย (~9-22 กม.)
      var km2 = 9 + Math.random() * 13;
      var p2 = offset(here, km2, Math.random() * Math.PI * 2);
      shops.push(makeShop(p2.lat, p2.lng, Math.random() < 0.12, k++));
    }
    CITIES.forEach(function(c){                     // ทั่วประเทศ เมืองละ 5-8 ร้าน
      var n = 5 + Math.floor(Math.random()*4);
      for(j = 0; j < n; j++){
        shops.push(makeShop(c.lat + rnd(-0.06,0.06), c.lng + rnd(-0.06,0.06),
                            Math.random() < 0.12, k++));
      }
    });
    return shops;
  }

  var mapBtn = document.getElementById("btnMap");
  var mapView = document.getElementById("mapView");
  var branchList = document.getElementById("branchList");
  var mapLocate = document.getElementById("mapLocate");
  var mapSearch = document.getElementById("mapSearch");
  var mapResults = document.getElementById("mapResults");
  var branchCountEl = document.getElementById("branchCount");
  var mapTitleEl = document.querySelector(".mapview__bar b");
  if(mapTitleEl) mapTitleEl.textContent = "ร้านอาหารใกล้ฉัน";

  var PIN = '<svg viewBox="0 0 36 46" xmlns="http://www.w3.org/2000/svg">'+
    '<path d="M18 45C6 28 3 22 3 16A15 15 0 0 1 33 16C33 22 30 28 18 45Z" fill="#15803d"/>'+
    '<circle cx="18" cy="16" r="9.5" fill="#fff"/>'+
    '<circle cx="18" cy="16" r="4.5" fill="#15803d"/></svg>';
  var PIN_CLOSED = '<svg viewBox="0 0 36 46" xmlns="http://www.w3.org/2000/svg">'+
    '<path d="M18 45C6 28 3 22 3 16A15 15 0 0 1 33 16C33 22 30 28 18 45Z" fill="#9ca3af"/>'+
    '<circle cx="18" cy="16" r="9.5" fill="#fff"/>'+
    '<circle cx="18" cy="16" r="4.5" fill="#9ca3af"/></svg>';
  var NAV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 19-9-9 19-2-8-8-2Z"/></svg>';

  /* --- Leaflet map (lazy init on first open) --- */
  var map = null, userMarker = null, searchMarker = null, tileLayer = null;
  var shopCluster = null, SHOPS = [], USER = null, mapPopulated = false;
  var hasL = (typeof L !== "undefined");
  var hasCluster = hasL && typeof L.markerClusterGroup === "function";

  var ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
  var BASEMAPS = [
    {id:"street", label:"มาตรฐาน", url:ESRI+"World_Street_Map/MapServer/tile/{z}/{y}/{x}",              attr:"Tiles &copy; Esri", opts:{maxZoom:19}},
    {id:"light",  label:"สว่าง",   url:ESRI+"Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",  attr:"Tiles &copy; Esri", opts:{maxZoom:19, maxNativeZoom:16}},
    {id:"dark",   label:"มืด",     url:ESRI+"Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",   attr:"Tiles &copy; Esri", opts:{maxZoom:19, maxNativeZoom:16}},
    {id:"osm",    label:"สีสด",    url:"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",            attr:"&copy; OpenStreetMap", opts:{maxZoom:19}},
    {id:"sat",    label:"ดาวเทียม", url:ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}",                 attr:"Tiles &copy; Esri", opts:{maxZoom:19}}
  ];
  function setBasemap(id){
    if(!map) return;
    var bm = null;
    for(var i=0;i<BASEMAPS.length;i++){ if(BASEMAPS[i].id === id){ bm = BASEMAPS[i]; break; } }
    if(!bm) bm = BASEMAPS[0];
    if(tileLayer) map.removeLayer(tileLayer);
    var o = {attribution: bm.attr};
    for(var k in bm.opts) o[k] = bm.opts[k];
    tileLayer = L.tileLayer(bm.url, o).addTo(map);
    if(tileLayer.setZIndex) tileLayer.setZIndex(0);
  }

  function pinIcon(closed){
    return L.divIcon({ className:"", html:'<div class="lpin lpin--brand'+(closed ? " lpin--closed" : "")+'">'+(closed ? PIN_CLOSED : PIN)+'</div>',
      iconSize:[34,44], iconAnchor:[17,44], popupAnchor:[0,-40] });
  }
  function dotIcon(cls, size){
    return L.divIcon({ className:"", html:'<div class="'+cls+'"></div>',
      iconSize:[size,size], iconAnchor:[size/2,size/2] });
  }

  function initMap(){
    if(map || !hasL) return;
    map = L.map("lmap", {zoomControl:false, attributionControl:true, maxZoom:19})
      .setView([13.7563, 100.5018], 12);
    L.control.zoom({position:"bottomright"}).addTo(map);
    setBasemap("light");
  }

  /* วางร้านทั้งหมดลงแผนที่ + สร้างรายการร้านใกล้เรา */
  function populate(here){
    USER = here;
    SHOPS = buildShops(here);
    SHOPS.forEach(function(sp){ sp.dist = distKm(here, sp); });

    if(shopCluster) map.removeLayer(shopCluster);
    shopCluster = hasCluster
      ? L.markerClusterGroup({maxClusterRadius:48, showCoverageOnHover:false})
      : L.layerGroup();

    SHOPS.forEach(function(sp, i){
      var m = L.marker([sp.lat, sp.lng], {icon: pinIcon(sp.closed), opacity: sp.closed ? 0.92 : 1});
      m.on("click", function(){ selectShop(i, false); openShopSheet(i); });
      sp.marker = m;
      shopCluster.addLayer(m);
    });
    map.addLayer(shopCluster);

    var near = SHOPS.map(function(sp, i){ return {sp:sp, i:i}; })
                    .sort(function(a, b){ return a.sp.dist - b.sp.dist; })
                    .slice(0, 60);
    branchCountEl.textContent = SHOPS.length + " ร้าน";
    renderList(near);
    mapPopulated = true;
  }

  function fmtKm(km){ return km < 10 ? km.toFixed(1) + " กม." : Math.round(km) + " กม."; }

  function renderList(near){
    branchList.innerHTML = near.map(function(o, rank){
      var sp = o.sp;
      var badge = rank === 0 ? '<span class="branch__badge">ใกล้ที่สุด</span>'
                : sp.brand ? '<span class="branch__badge">อิ่มจัง</span>' : '';
      return '<article class="branch" data-i="'+o.i+'">'+
        '<div class="branch__art'+(sp.closed ? " is-closed" : "")+'" aria-hidden="true">'+shopArt(sp)+'</div>'+
        '<div class="branch__info">'+
          '<h3>'+ (sp.brand ? "อิ่มจัง · " : "") + sp.name + badge +'</h3>'+
          '<div class="addr">'+sp.a+'</div>'+
          '<div class="branch__meta">'+
            '<span class="rate">★ '+sp.rating.toFixed(1)+'</span>'+
            '<span class="dist">◉ '+fmtKm(sp.dist)+'</span>'+
            '<span class="'+(sp.closed ? "closed" : "open")+'">'+sp.s+'</span>'+
          '</div>'+
        '</div>'+
        '<a class="branch__nav" href="https://www.google.com/maps/search/?api=1&query='+sp.lat+','+sp.lng+'" target="_blank" rel="noopener" aria-label="นำทางไป '+sp.name+'">'+NAV+'</a>'+
      '</article>';
    }).join("");
  }

  function selectShop(i, fly){
    var sp = SHOPS[i];
    if(!sp) return;
    branchList.querySelectorAll(".branch").forEach(function(c){
      c.classList.toggle("is-active", +c.dataset.i === i);
    });
    var card = branchList.querySelector('.branch[data-i="'+i+'"]');
    if(card) card.scrollIntoView({block:"nearest", behavior:"smooth"});
    if(map && fly) map.flyTo([sp.lat, sp.lng], 16, {duration:0.6});
  }
  branchList.addEventListener("click", function(e){
    if(e.target.closest(".branch__nav")) return;
    var c = e.target.closest(".branch");
    if(!c) return;
    var i = +c.dataset.i;
    selectShop(i, true);
    openShopSheet(i);
  });

  /* --- แผ่นข้อมูลร้าน (ข้อมูล / โทร / ส่งข้อความ / นำทาง) --- */
  var shopSheet = document.getElementById("shopSheet");
  var ICO = {
    pin:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2.1Z"/></svg>',
    dish: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13a8 8 0 0 1 16 0Z"/><path d="M3 17h18"/><path d="M12 5V3"/></svg>'
  };
  function row(icon, k, v){
    return '<div class="ss-row">'+icon+'<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div></div>';
  }
  function openShopSheet(i){
    var sp = SHOPS[i];
    if(!sp) return;
    var tel = sp.phone.replace(/-/g, "");
    document.getElementById("ssCover").innerHTML = shopArt(sp);
    document.querySelector(".shopsheet__hero").classList.toggle("is-closed", !!sp.closed);
    document.getElementById("ssName").textContent = (sp.brand ? "อิ่มจัง · " : "") + sp.name;
    var st = document.getElementById("ssStatus");
    st.textContent = sp.closed ? "ปิดอยู่" : "เปิดอยู่";
    st.className = "ss-status " + (sp.closed ? "closed" : "open");
    document.getElementById("ssMeta").innerHTML =
      '<span class="rate">★ '+sp.rating.toFixed(1)+' ('+sp.sold.toLocaleString("th-TH")+')</span>'+
      '<span class="dist">◉ ห่าง '+fmtKm(sp.dist)+'</span>'+
      '<span class="price">'+sp.price+'</span>'+
      '<span class="cuisine">'+sp.cuisine+'</span>';
    document.getElementById("ssRows").innerHTML =
      row(ICO.pin, "ที่อยู่", sp.a) +
      row(ICO.clock, "เวลาทำการ", sp.closed
          ? "ปิดอยู่ · เปิด " + sp.openAt + " น."
          : "เปิดอยู่ · ปิด " + sp.closeAt + " น.") +
      row(ICO.phone, "เบอร์โทร", sp.phone) +
      row(ICO.dish, "ประเภทอาหาร", sp.cuisine);
    document.getElementById("ssCall").href = "tel:" + tel;
    document.getElementById("ssMsg").href = "sms:" + tel;
    document.getElementById("ssNav").href =
      "https://www.google.com/maps/search/?api=1&query=" + sp.lat + "," + sp.lng;
    shopSheet.hidden = false;
  }
  function closeShopSheet(){ shopSheet.hidden = true; }
  shopSheet.addEventListener("click", function(e){
    if(e.target.closest("[data-shopclose]")) closeShopSheet();
  });

  /* --- ตำแหน่งของเรา: GPS จริง ถ้าไม่ได้ใช้ตำแหน่งจำลองสุ่ม --- */
  function markUser(loc, label){
    var ll = [loc.lat, loc.lng];
    if(userMarker) userMarker.setLatLng(ll);
    else userMarker = L.marker(ll, {icon:dotIcon("lme", 18), keyboard:false, zIndexOffset:1000}).addTo(map);
    userMarker.bindPopup(label);
  }
  function resolveLocation(cb){
    var done = false;
    function fake(){
      if(done) return; done = true;
      cb({lat: 13.700 + Math.random()*0.130, lng: 100.470 + Math.random()*0.150}, false);
    }
    var giveUp = setTimeout(fake, 7000);
    if(!navigator.geolocation){ clearTimeout(giveUp); fake(); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      if(done) return; done = true; clearTimeout(giveUp);
      cb({lat: pos.coords.latitude, lng: pos.coords.longitude}, true);
    }, function(){ clearTimeout(giveUp); fake(); },
    {enableHighAccuracy:true, timeout:6500, maximumAge:60000});
  }
  function goToMe(loc, real){
    markUser(loc, real ? "คุณอยู่ที่นี่" : "ตำแหน่งจำลอง (เดโม)");
    populate(loc);
    map.setView([loc.lat, loc.lng], 15, {animate:true});
    if(!real) showToast("ใช้ตำแหน่งจำลองแบบสุ่ม");
  }
  mapLocate.addEventListener("click", function(){
    if(!map) return;
    mapLocate.classList.add("loading");
    resolveLocation(function(loc, real){
      mapLocate.classList.remove("loading");
      goToMe(loc, real);
    });
  });

  /* --- search places nationwide (Nominatim / OpenStreetMap) --- */
  var searchT = null;
  mapSearch.addEventListener("input", function(){
    clearTimeout(searchT);
    var q = mapSearch.value.trim();
    if(q.length < 3){ mapResults.innerHTML = ""; return; }
    searchT = setTimeout(function(){ runSearch(q); }, 420);
  });
  function runSearch(q){
    var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=th&accept-language=th&q=" + encodeURIComponent(q);
    fetch(url).then(function(r){ return r.json(); }).then(function(list){
      if(!Array.isArray(list) || !list.length){
        mapResults.innerHTML = '<button type="button" disabled>ไม่พบสถานที่</button>';
        return;
      }
      mapResults.innerHTML = list.map(function(it){
        return '<button type="button" data-lat="'+it.lat+'" data-lon="'+it.lon+'">'+
          it.display_name.replace(/</g,"&lt;")+'</button>';
      }).join("");
    }).catch(function(){
      mapResults.innerHTML = '<button type="button" disabled>ค้นหาไม่สำเร็จ (ตรวจอินเทอร์เน็ต)</button>';
    });
  }
  mapResults.addEventListener("click", function(e){
    var b = e.target.closest("button[data-lat]");
    if(!b || !map) return;
    var ll = [parseFloat(b.dataset.lat), parseFloat(b.dataset.lon)];
    if(searchMarker) searchMarker.setLatLng(ll);
    else searchMarker = L.marker(ll, {icon:dotIcon("lsearch", 20)}).addTo(map);
    searchMarker.bindPopup(b.textContent).openPopup();
    map.flyTo(ll, 15, {duration:0.7});
    mapResults.innerHTML = "";
    mapSearch.blur();
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest(".map-search")) mapResults.innerHTML = "";
  });

  /* --- open / close with mascot loading --- */
  function openMap(){
    mapView.hidden = false;
    document.body.style.overflow = "hidden";
    mapView.classList.remove("ready");
    initMap();
    if(!mapPopulated){
      resolveLocation(function(loc, real){
        if(map) map.invalidateSize();
        goToMe(loc, real);
      });
    }
    var wait = reduce ? 350 : 1600;
    setTimeout(function(){
      mapView.classList.add("ready");
      if(map) map.invalidateSize();
    }, wait);
  }
  function closeMap(){ closeShopSheet(); mapView.hidden = true; document.body.style.overflow = ""; mapBtn.focus(); }
  mapBtn.addEventListener("click", openMap);
  mapView.addEventListener("click", function(e){
    if(e.target.closest("[data-close]")) closeMap();
  });
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(!shopSheet.hidden){ closeShopSheet(); return; }
    if(!mapView.hidden) closeMap();
  });
})();
</script>
</body>
</html>
